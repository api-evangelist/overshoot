aid: overshoot
name: Overshoot
description: Overshoot is a real-time video understanding API. Developers create a live video stream,
  publish frames over WebRTC (LiveKit), then query what the camera sees with vision-language models through
  an OpenAI-compatible chat completions endpoint — sub-200ms inference against a large catalog of VLMs.
  Overshoot (YC W2026) targets physical security, safety, gaming, robotics, and consumer products, exposing
  stream lifecycle management, model listing, prepaid-credit billing, and per-model pricing over a single
  REST host at api.overshoot.ai.
